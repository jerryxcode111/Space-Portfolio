<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Muhammad Jahanzaib — Celestial Portfolio</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;700;800&amp;family=Geist:wght@300;400;500;600&amp;family=Instrument+Serif:ital@1&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            background: "#05060A",
            surface: "#05060A",
            "surface-dim": "#05060A",
            "surface-container-lowest": "#030406",
            "surface-container-low": "#0b0c13",
            "surface-container": "#10121b",
            "surface-container-high": "#171924",
            "surface-container-highest": "#1f2231",
            "on-surface": "#ECEFFF",
            "on-surface-variant": "#9FA4BC",
            outline: "#676C82",
            "outline-variant": "#262938",
            primary: "#ECEFFF",
            mars: "#B2634A",
            "mars-bright": "#D67B5F",
            saturn: "#CDB98A",
            "saturn-bright": "#E6D7B0"
          },
          fontFamily: {
            headline: ["Bricolage Grotesque", "sans-serif"],
            body: ["Geist", "sans-serif"],
            mono: ["JetBrains Mono", "monospace"],
            serif: ["Instrument Serif", "serif"]
          }
        }
      }
    };
  </script>
<style>
    @layer base {
      html, body {
        margin: 0;
        padding: 0;
        background-color: #05060A;
        color: #ECEFFF;
      }
      body {
        overscroll-behavior: none;
      }
    }
    ::-webkit-scrollbar {
      display: none;
    }
    .text-stroke-bright {
      -webkit-text-stroke: 1.75px rgba(236, 239, 255, 0.95);
      color: transparent;
    }
  </style>
</head>
<body class="bg-[#05060A] font-body text-on-surface antialiased selection:bg-white/20 selection:text-white relative min-h-screen overflow-x-hidden">
<!-- Subtle Starlight Grain Grid -->
<div class="pointer-events-none fixed inset-0 z-20 opacity-[0.035] mix-blend-screen" style="background-image:radial-gradient(rgba(236,239,255,0.9) 1px, transparent 0); background-size:32px 32px;"></div>
<!-- FLOATING CENTERED PILL NAVBAR -->
<header class="fixed top-6 left-1/2 -translate-x-1/2 z-50 pointer-events-auto">
<nav class="bg-[#05060A]/80 backdrop-blur-xl border border-white/10 rounded-full px-7 py-2.5 flex items-center gap-7 shadow-[0_16px_40px_rgba(0,0,0,0.85)]">
<a class="font-body text-[13px] tracking-wide text-on-surface-variant hover:text-white transition-colors" href="#">Home</a>
<a class="font-body text-[13px] tracking-wide text-on-surface-variant hover:text-white transition-colors" href="#">About</a>
<a class="font-body text-[13px] tracking-wide text-white font-medium transition-colors" href="#focus">Focus</a>
<a class="font-body text-[13px] tracking-wide text-on-surface-variant hover:text-white transition-colors" href="#journey">Work</a>
<a class="font-body text-[13px] tracking-wide text-on-surface-variant hover:text-white transition-colors" href="#">Contact</a>
</nav>
</header>
<!-- FIXED BOTTOM CORNERS -->
<div class="fixed bottom-6 left-6 z-40 pointer-events-none select-none">
<span class="font-mono text-[11px] tracking-[0.2em] text-[#676C82] uppercase">03 — MARS</span>
</div>
<div class="fixed bottom-6 right-6 z-40 pointer-events-auto">
<button class="font-mono text-[11px] text-[#9FA4BC] hover:text-white border border-white/10 hover:border-white/30 bg-[#05060A]/80 backdrop-blur-md px-3.5 py-1.5 rounded-full transition-all flex items-center gap-2 shadow-[0_8px_24px_rgba(0,0,0,0.6)]" type="button">
      Motion <span class="text-[#D67B5F] text-[8px] animate-pulse">●</span> ON
    </button>
</div>
<main class="w-full bg-[#05060A] relative z-10">
<!-- ========================================== -->
<!-- SECTION 03 — FOCUS // MARS                 -->
<!-- ========================================== -->
<section class="relative w-full min-h-screen flex flex-col justify-between overflow-hidden px-6 lg:px-16 py-20 select-none border-b border-white/5" id="focus">
<!-- Vivid Atmospheric Mars with Dramatic Rim Light & Glow -->
<div class="pointer-events-none absolute -right-32 md:-right-48 -top-16 w-[550px] h-[550px] md:w-[780px] md:h-[780px] rounded-full" style="background: radial-gradient(circle at 75% 25%, #D67B5F 0%, #B2634A 25%, #38150C 55%, #05060A 80%);
                  box-shadow: inset -45px -45px 90px rgba(0,0,0,0.98), inset 12px 12px 40px rgba(214,123,95,0.9), 0 0 160px rgba(178,99,74,0.45);
                  filter: drop-shadow(0 0 90px rgba(178,99,74,0.3));">
<!-- Mars Atmosphere Haze -->
<div class="w-full h-full rounded-full opacity-60 mix-blend-screen bg-gradient-to-tr from-transparent via-[#B2634A]/30 to-[#D67B5F]/40"></div>
</div>
<!-- Section Label: "03 — MARS" only -->
<div class="w-full max-w-7xl mx-auto flex items-center justify-between z-10 pt-4">
<div class="flex items-center gap-3">
<span class="w-2 h-2 rounded-full bg-[#B2634A] shadow-[0_0_12px_#D67B5F]"></span>
<span class="font-mono text-xs text-on-surface uppercase tracking-[0.25em]">03 — MARS</span>
</div>
</div>
<!-- Main Central Composition: FLUTTER + PHONE OUTLINE + DART -->
<div class="relative w-full max-w-7xl mx-auto my-auto py-8 flex flex-col items-center justify-center z-10">
<!-- FLUTTER: Solid Display Bold (Same Giant Size) -->
<div class="w-full flex justify-center text-center">
<h1 class="font-headline font-bold uppercase tracking-tighter text-white leading-none select-none text-[clamp(4.25rem,15vw,13.5rem)] drop-shadow-[0_15px_30px_rgba(0,0,0,0.9)]">
            FLUTTER
          </h1>
</div>
<!-- Center Phone Outline (Clean, slim, sits strictly between texts without overlap) -->
<div class="w-full flex flex-col items-center justify-center my-6 md:my-8 z-20">
<div class="relative w-32 h-56 sm:w-36 sm:h-64 md:w-40 md:h-72 rounded-[2.2rem] border border-[#B2634A]/60 bg-[#05060A]/70 backdrop-blur-xl p-2.5 shadow-[0_0_40px_rgba(178,99,74,0.25),inset_0_0_15px_rgba(214,123,95,0.2)] flex flex-col justify-between">
<!-- Dynamic speaker notch -->
<div class="w-10 h-1.5 bg-white/20 rounded-full mx-auto"></div>
<!-- Minimal viewport inner line -->
<div class="w-full h-[calc(100%-1.75rem)] rounded-[1.6rem] border border-white/10 flex flex-col items-center justify-center relative overflow-hidden bg-gradient-to-b from-[#B2634A]/10 to-transparent">
<div class="w-10 h-10 rounded-full border border-[#D67B5F]/40 flex items-center justify-center">
<div class="w-2 h-2 rounded-full bg-[#D67B5F] shadow-[0_0_8px_#D67B5F]"></div>
</div>
</div>
</div>
<!-- Short Supporting Line (One sentence only) -->
<p class="mt-7 text-center font-body text-base md:text-lg text-on-surface font-normal tracking-wide">
            Crafting fluid <span class="font-serif italic text-2xl md:text-3xl text-white ml-0.5">mobile</span> experiences.
          </p>
</div>
<!-- DART: Bright Outline Display Bold (Same Giant Size) -->
<div class="w-full flex justify-center text-center">
<h1 class="font-headline font-bold uppercase tracking-tighter text-stroke-bright leading-none select-none text-[clamp(4.25rem,15vw,13.5rem)] drop-shadow-[0_0_25px_rgba(236,239,255,0.25)]">
            DART
          </h1>
</div>
</div>
<div class="w-full max-w-7xl mx-auto z-10 pb-2"></div>
</section>
<!-- ========================================== -->
<!-- SECTION 04 — JOURNEY // SATURN             -->
<!-- ========================================== -->
<section class="relative w-full min-h-screen flex flex-col justify-between overflow-hidden px-6 lg:px-16 py-20 select-none" id="journey">
<!-- Saturn Planet Sphere: Large, Clearly Visible with Enhanced Rim Light & Atmosphere -->
<div class="pointer-events-none absolute -left-28 md:-left-20 top-1/2 -translate-y-1/2 w-[440px] h-[440px] md:w-[620px] md:h-[620px] rounded-full z-0" style="background: radial-gradient(circle at 65% 35%, #E6D7B0 0%, #CDB98A 30%, #4D4229 65%, #05060A 90%);
                  box-shadow: inset -40px -40px 90px rgba(0,0,0,0.98), inset 12px 12px 35px rgba(230,215,176,0.85), 0 0 140px rgba(205,185,138,0.3);
                  filter: drop-shadow(0 0 80px rgba(205,185,138,0.25));">
<!-- Saturn Banding Strata -->
<div class="w-full h-full rounded-full opacity-35 bg-gradient-to-tr from-transparent via-[#CDB98A] to-transparent"></div>
</div>
<!-- Bright Iconic Tilted Pale-Gold Planetary Ring Spanning Across the Section -->
<div class="pointer-events-none absolute inset-0 w-full h-full z-1 overflow-visible">
<svg class="w-full h-full" preserveaspectratio="none" viewbox="0 0 1440 900">
<defs>
<lineargradient id="saturnRingGlow" x1="0%" x2="100%" y1="100%" y2="0%">
<stop offset="0%" stop-color="#CDB98A" stop-opacity="0.1"></stop>
<stop offset="45%" stop-color="#E6D7B0" stop-opacity="0.9"></stop>
<stop offset="85%" stop-color="#CDB98A" stop-opacity="0.4"></stop>
<stop offset="100%" stop-color="#CDB98A" stop-opacity="0.05"></stop>
</lineargradient>
</defs>
<!-- Broad diffuse ring glow -->
<path d="M-120,680 C360,560 920,380 1560,200" fill="none" filter="blur(6px)" stroke="#CDB98A" stroke-opacity="0.2" stroke-width="32"></path>
<!-- Prominent Primary Gold Ring -->
<path d="M-120,680 C360,560 920,380 1560,200" fill="none" id="ringTrajectory" stroke="url(#saturnRingGlow)" stroke-width="2.5"></path>
<!-- Subtle Outer Echo Ring Line -->
<path d="M-120,660 C360,540 920,360 1560,180" fill="none" stroke="#CDB98A" stroke-dasharray="4 4" stroke-opacity="0.25" stroke-width="1"></path>
<path d="M-120,705 C360,585 920,405 1560,225" fill="none" stroke="#CDB98A" stroke-opacity="0.25" stroke-width="0.75"></path>
</svg>
</div>
<!-- Section Label: "04 — SATURN" only -->
<div class="w-full max-w-7xl mx-auto flex items-center justify-between z-10 pt-4">
<div class="flex items-center gap-3">
<span class="w-2 h-2 rounded-full bg-[#CDB98A] shadow-[0_0_12px_#E6D7B0]"></span>
<span class="font-mono text-xs text-on-surface uppercase tracking-[0.25em]">04 — SATURN</span>
</div>
</div>
<!-- Section Body Content -->
<div class="relative w-full max-w-7xl mx-auto my-auto py-12 flex flex-col justify-center z-10">
<!-- Headline: "Finding my orbit." in Bricolage Grotesque bold with ONLY "orbit" in Instrument Serif Italic -->
<div class="max-w-2xl mb-16 md:mb-24">
<h2 class="font-headline font-bold text-5xl md:text-7xl lg:text-8xl text-white tracking-tight leading-none">
            Finding my <span class="font-serif italic font-normal text-[#E6D7B0] text-6xl md:text-8xl lg:text-9xl ml-1">orbit</span>.
          </h2>
</div>
<!-- Ring Timeline: 3 Milestone Dots Positioned Directly Along the Ring Curve -->
<!-- Responsive layout: absolute along the diagonal trajectory on desktop, clean spaced waypoints on mobile -->
<div class="relative w-full min-h-[300px] md:min-h-[260px]">
<div class="grid grid-cols-1 md:grid-cols-3 gap-12 md:gap-8 items-start relative w-full">
<!-- DOT 1: Foundations (Lower left along ring incline) -->
<div class="relative flex flex-col items-start md:translate-y-24 group">
<div class="flex items-center gap-3 mb-3">
<div class="relative flex items-center justify-center">
<span class="w-3.5 h-3.5 rounded-full bg-[#CDB98A] shadow-[0_0_16px_#E6D7B0]"></span>
<span class="absolute w-6 h-6 rounded-full border border-[#CDB98A]/40 animate-ping" style="animation-duration: 3s;"></span>
</div>
<h3 class="font-headline font-bold text-xl md:text-2xl text-white tracking-tight">Foundations</h3>
</div>
<p class="font-body text-sm md:text-base text-on-surface-variant font-light pl-6 max-w-[260px]">
                Computer Science, The Superior University
              </p>
</div>
<!-- DOT 2: Direction (Mid level along ring incline) -->
<div class="relative flex flex-col items-start md:translate-y-12 group">
<div class="flex items-center gap-3 mb-3">
<div class="relative flex items-center justify-center">
<span class="w-3.5 h-3.5 rounded-full bg-[#CDB98A] shadow-[0_0_16px_#E6D7B0]"></span>
<span class="absolute w-6 h-6 rounded-full border border-[#CDB98A]/40 animate-ping" style="animation-duration: 3.5s;"></span>
</div>
<h3 class="font-headline font-bold text-xl md:text-2xl text-white tracking-tight">Direction</h3>
</div>
<p class="font-body text-sm md:text-base text-on-surface-variant font-light pl-6 max-w-[260px]">
                Flutter and Dart
              </p>
</div>
<!-- DOT 3: In progress (Higher right along ring incline) -->
<div class="relative flex flex-col items-start md:-translate-y-2 group">
<div class="flex items-center gap-3 mb-3">
<div class="relative flex items-center justify-center">
<span class="w-3.5 h-3.5 rounded-full bg-[#E6D7B0] shadow-[0_0_20px_#E6D7B0]"></span>
<span class="absolute w-6 h-6 rounded-full border border-[#E6D7B0]/60 animate-ping" style="animation-duration: 2.5s;"></span>
</div>
<h3 class="font-headline font-bold text-xl md:text-2xl text-[#E6D7B0] tracking-tight">In progress</h3>
</div>
<p class="font-body text-sm md:text-base text-on-surface-variant font-light pl-6 max-w-[260px]">
                Growing as a developer
              </p>
</div>
</div>
</div>
</div>
<div class="w-full max-w-7xl mx-auto z-10 pb-4"></div>
</section>
</main>
<script>
    (function initPortfolioInteractions() {
      // Dynamic section active indicator in pill navbar
      const focusSec = document.getElementById('focus');
      const journeySec = document.getElementById('journey');
      const navLinks = document.querySelectorAll('header nav a');
      const bottomLabel = document.querySelector('.fixed.bottom-6.left-6 span');

      window.addEventListener('scroll', () => {
        const scrollPos = window.scrollY + window.innerHeight * 0.4;
        const journeyTop = journeySec ? journeySec.offsetTop : 0;

        if (scrollPos >= journeyTop) {
          if (bottomLabel) bottomLabel.textContent = '04 — SATURN';
          navLinks.forEach(l => {
            if (l.getAttribute('href') === '#journey') {
              l.className = 'font-body text-[13px] tracking-wide text-white font-medium transition-colors';
            } else {
              l.className = 'font-body text-[13px] tracking-wide text-on-surface-variant hover:text-white transition-colors';
            }
          });
        } else {
          if (bottomLabel) bottomLabel.textContent = '03 — MARS';
          navLinks.forEach(l => {
            if (l.getAttribute('href') === '#focus') {
              l.className = 'font-body text-[13px] tracking-wide text-white font-medium transition-colors';
            } else {
              l.className = 'font-body text-[13px] tracking-wide text-on-surface-variant hover:text-white transition-colors';
            }
          });
        }
      }, { passive: true });
    })();
  </script>
</body></html>
